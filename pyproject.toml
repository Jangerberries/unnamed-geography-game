[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geotui"
dynamic = ["version"]
description = 'Simple geography quiz for the terminal'
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = []
authors = [
  { name = "Øyvind I. Berntsen", email = "oi.berntsen@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "textual>=0.73.0",
]

[project.urls]
Documentation = "https://github.com/Øyvind I. Berntsen/geotui#readme"
Issues = "https://github.com/Øyvind I. Berntsen/geotui/issues"
Source = "https://github.com/Øyvind I. Berntsen/geotui"

[tool.hatch.version]
path = "src/geotui/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/geotui tests}"

[tool.coverage.run]
source_pkgs = ["geotui", "tests"]
branch = true
parallel = true
omit = [
  "src/geotui/__about__.py",
]

[tool.coverage.paths]
geotui = ["src/geotui", "*/geotui/src/geotui"]
tests = ["tests", "*/geotui/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
